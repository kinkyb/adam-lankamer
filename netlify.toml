# --- translatea.com domain redirect -------------------------------------
# translatea.com is an alias of this site (OVH DNS -> Netlify). Everything on
# that hostname 301s to the TransLateA page here. MUST stay above the pretty-URL
# rewrites below: those use relative paths and would otherwise match on the
# translatea.com hostname too. Email (adam@translatea.com) stays on OVH MX —
# never move the nameservers away from OVH.
[[redirects]]
  from = "https://translatea.com/*"
  to = "https://adamlankamer.com/translatea"
  status = 301
  force = true

[[redirects]]
  from = "https://www.translatea.com/*"
  to = "https://adamlankamer.com/translatea"
  status = 301
  force = true

[[redirects]]
  from = "http://translatea.com/*"
  to = "https://adamlankamer.com/translatea"
  status = 301
  force = true

[[redirects]]
  from = "http://www.translatea.com/*"
  to = "https://adamlankamer.com/translatea"
  status = 301
  force = true

[[redirects]]
  from = "/translatea"
  to   = "/translatea.html"
  status = 200

[[redirects]]
  from = "/fotostories"
  to   = "/fotostories.html"
  status = 200

[[redirects]]
  from = "/fotostories/partners"
  to   = "/fotostories/partners.html"
  status = 200

[[redirects]]
  from = "/ai"
  to   = "/ai.html"
  status = 200

[[redirects]]
  from = "/ai/website-development"
  to   = "/ai/website-development.html"
  status = 200

[build]
  publish = "."

# Security + privacy headers — applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=(), browsing-topics=(), camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache static assets — content-hashed by Netlify edge
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
